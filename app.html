<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comunic</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Inter:wght@700&family=Orbitron:wght@700&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1020;--card:#1a1b33;--text:#f2f2fa;--muted:#a0a2c0;--a:#6c5ce7;--b:#00cec9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--card);border:1px solid #33355a;border-radius:10px;padding:12px;width:100%}
.btn{background:var(--a);border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.s{background:#33355a;padding:6px 12px;font-size:14px}
.hide{display:none!important}
#auth{max-width:380px;margin:0 auto;padding:60px 24px;display:flex;flex-direction:column;gap:12px}
#auth h1{font-size:34px;text-align:center}#auth h1 span{color:var(--b)}
#amsg{color:var(--b);min-height:22px;text-align:center;font-size:14px}
.link{color:var(--muted);text-align:center;cursor:pointer;font-size:14px}
#app{height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
#main{flex:1;overflow-y:auto;padding:14px}
#tabs{display:flex;background:var(--card);padding-bottom:env(safe-area-inset-bottom,0)}
#tabs button{flex:1;padding:14px;background:none;border:0;color:var(--muted);cursor:pointer}
#tabs button.on{color:var(--b);font-weight:700}
h3{margin:14px 0 8px;font-size:15px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:10px;background:var(--card);border-radius:12px;margin-bottom:8px}
.row .g{flex:1;min-width:0}.row small{color:var(--muted);display:block}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.av.l{width:90px;height:90px;font-size:32px}
.nm{-webkit-background-clip:text;background-clip:text;color:transparent;font-size:18px;-webkit-text-fill-color:transparent}
#notes{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.note{flex:none;width:76px;text-align:center;cursor:pointer;font-size:12px}
.note .bub{background:var(--card);border-radius:12px;padding:5px 6px;margin-bottom:4px;min-height:28px;font-size:12px;word-break:break-word}
.note .av{margin:0 auto}
#chat{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5}
#chead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card)}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:75%;padding:9px 13px;border-radius:16px;background:var(--card);align-self:flex-start;word-break:break-word}
.m.me{background:var(--a);align-self:flex-end}
.m audio{max-width:210px;height:36px}
#cbar{display:flex;gap:8px;padding:10px;background:var(--card);padding-bottom:calc(10px + env(safe-area-inset-bottom,0))}
.mic{background:#33355a;border:0;border-radius:50%;width:44px;height:44px;flex:none;cursor:pointer;font-size:18px}
.mic.rec{background:#e74c3c;animation:p 1s infinite}
@keyframes p{50%{opacity:.5}}
.cr{display:flex;gap:10px;margin:8px 0}.cr input[type=color]{padding:2px;height:44px}
</style>
</head>
<body>
<div id="auth">
  <h1>Comu<span>nic</span></h1>
  <p style="text-align:center;color:var(--muted)">Discord-оор нэвтэрч шууд эхэл</p>
  <button class="btn" style="background:#5865F2;padding:14px" onclick="discordLogin()">Discord-оор нэвтрэх</button>
  <div id="amsg"></div>
</div>

<div id="app" class="hide">
  <div id="main"></div>
  <div id="tabs">
    <button data-t="home" class="on">💬 Чат</button>
    <button data-t="find">🔍 Найз</button>
    <button data-t="me">👤 Профайл</button>
  </div>
  <div id="chat" class="hide">
    <div id="chead"><button class="btn s" onclick="closeChat()">←</button><div id="cinfo" style="display:flex;align-items:center;gap:10px"></div></div>
    <div id="msgs"></div>
    <div id="cbar">
      <button class="mic" id="cmic" onclick="toggleRec(this,sendVoice)">🎤</button>
      <input id="ctext" placeholder="Мессеж..." onkeydown="if(event.key==='Enter')sendText()">
      <button class="btn" onclick="sendText()">➤</button>
    </div>
  </div>
</div>

<script>
var SB_URL='https://mefuakmklbuzqroerzre.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lZnVha21rbGJ1enFyb2VyenJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MzEyNTEsImV4cCI6MjEwNjUwNzI1MX0.uR6iwXzcCen5Ws7nHrGx_zMjGRzHeWGQHDPuAhkY204';
var sb=supabase.createClient(SB_URL,SB_KEY);
var $=function(i){return document.getElementById(i)};
var me,prof,friends=[],cur=null,seen={},tab='home',rec,chunks=[];
var FONTS=['Inter','Pacifico','Bebas Neue','Caveat','Orbitron'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeColor(c){return /^#[0-9a-f]{6}$/i.test(c)?c:'#ffffff'}
function safeFont(f){return FONTS.indexOf(f)>-1?f:'Inter'}
function nameHTML(p){return '<span class="nm" style="font-family:\''+safeFont(p.font)+'\',sans-serif;background-image:linear-gradient(90deg,'+safeColor(p.color1)+','+safeColor(p.color2)+')">'+esc(p.display_name||p.username)+'</span>'}
function avHTML(p,big){var c='av'+(big?' l':'');return p.avatar_url?'<img class="'+c+'" src="'+esc(p.avatar_url)+'">':'<div class="'+c+'">'+esc((p.username||'?')[0].toUpperCase())+'</div>'}

/* ---------- Auth ---------- */
function discordLogin(){sb.auth.signInWithOAuth({provider:'discord',options:{redirectTo:location.origin+location.pathname}})}
var started=false;
function cleanName(x){x=String(x||'user').toLowerCase().replace(/[^a-z0-9_]/g,'_').slice(0,20);return x.length<3?x+'_usr':x}
async function makeProfile(u){
  var m=u.user_metadata||{},base=cleanName(m.full_name||m.user_name||m.name),un=base;
  for(var i=0;i<4;i++){
    var r=await sb.from('profiles').insert({id:u.id,username:un,display_name:(m.custom_claims&&m.custom_claims.global_name)||m.full_name||un,avatar_url:m.avatar_url||m.picture||null,username_set:true}).select().single();
    if(r.data)return r.data;
    if(r.error&&r.error.code==='23505'){
      var ex=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(ex.data)return ex.data;
      un=base.slice(0,14)+'_'+Math.random().toString(36).slice(2,7);
    }else{console.error(r.error);break}
  }
  return null;
}
async function start(u){
  if(started)return;started=true;me=u;
  var r=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();prof=r.data;
  if(!prof)prof=await makeProfile(u);
  if(!prof){started=false;$('auth').classList.remove('hide');$('amsg').textContent='Профайл үүсгэж чадсангүй. Supabase дээр discord-patch.sql ажиллуулсан эсэхээ шалгана уу.';return}
  $('auth').classList.add('hide');$('app').classList.remove('hide');
  sb.channel('msgs').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(x){
    var m=x.new;if(cur&&(m.sender===cur.id||m.receiver===cur.id))addMsg(m)}).subscribe();
  show('home');
}
sb.auth.onAuthStateChange(function(ev,sess){if(sess&&sess.user)start(sess.user)});
sb.auth.getSession().then(function(r){if(r.data.session)start(r.data.session.user)});
(function(){var q=new URLSearchParams(location.search+'&'+location.hash.replace(/^#/,'')),e=q.get('error_description');if(e)$('amsg').textContent='Нэвтрэх алдаа: '+e})();

/* ---------- Tabs ---------- */
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){show(b.dataset.t)}});
function show(t){tab=t;document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  if(t==='home')home();else if(t==='find')find();else profile()}

/* ---------- Home ---------- */
async function getRel(){
  var r=await sb.from('friendships').select('*');var map={};
  (r.data||[]).forEach(function(f){var o=f.requester===me.id?f.addressee:f.requester;map[o]=f});return map}
async function home(){
  var rel=await getRel(),ids=Object.keys(rel).filter(function(k){return rel[k].status==='accepted'});
  friends=ids.length?(await sb.from('profiles').select('*').in('id',ids)).data||[]:[];
  var day=Date.now()-864e5,h='<h3>Нотууд</h3><div id="notes">';
  h+='<div class="note" onclick="show(\'me\')"><div class="bub">'+esc(prof.note_text||'+ Нот')+(prof.note_audio?' 🎧':'')+'</div>'+avHTML(prof)+'<div>Би</div></div>';
  friends.forEach(function(f){if((f.note_text||f.note_audio)&&new Date(f.note_at).getTime()>day)
    h+='<div class="note" onclick="playNote(\''+f.id+'\')"><div class="bub">'+esc(f.note_text||'')+(f.note_audio?' 🎧':'')+'</div>'+avHTML(f)+'<div>'+esc(f.username)+'</div></div>'});
  h+='</div><h3>Чатууд</h3>';
  if(!friends.length)h+='<p style="color:var(--muted)">Найз байхгүй байна. "Найз" цэсээс хайж нэм.</p>';
  friends.forEach(function(f){h+='<div class="row" onclick="openChat(\''+f.id+'\')">'+avHTML(f)+'<div class="g">'+nameHTML(f)+'<small>@'+esc(f.username)+'</small></div></div>'});
  $('main').innerHTML=h;
}
function playNote(id){var f=friends.filter(function(x){return x.id===id})[0];if(f&&f.note_audio)new Audio(f.note_audio).play()}

/* ---------- Find friends ---------- */
async function find(){
  $('main').innerHTML='<input id="q" placeholder="Username-аар хайх..." oninput="doSearch()"><div id="req"></div><h3 id="fh">Шинээр нэгдсэн</h3><div id="res"></div>';
  var rel=await getRel();window._rel=rel;
  var inc=Object.keys(rel).filter(function(k){return rel[k].status==='pending'&&rel[k].addressee===me.id});
  if(inc.length){var ps=(await sb.from('profiles').select('*').in('id',inc)).data||[];
    $('req').innerHTML='<h3>Ирсэн хүсэлт</h3>'+ps.map(function(p){return '<div class="row">'+avHTML(p)+'<div class="g">'+nameHTML(p)+'<small>@'+esc(p.username)+'</small></div><button class="btn s" style="background:var(--a)" onclick="accept(\''+rel[p.id].id+'\')">Зөвшөөрөх</button></div>'}).join('')}
  doSearch();
}
var st;function doSearch(){clearTimeout(st);st=setTimeout(runSearch,250)}
async function runSearch(){
  var q=($('q')&&$('q').value||'').toLowerCase().replace(/[^a-z0-9_]/g,'');
  var b=sb.from('profiles').select('*').neq('id',me.id);
  b=q?b.ilike('username','%'+q+'%').limit(20):b.order('created_at',{ascending:false}).limit(20);
  var r=await b;if(!$('res'))return;$('fh').textContent=q?'Үр дүн':'Шинээр нэгдсэн';
  var rel=window._rel||{};
  $('res').innerHTML=(r.data||[]).map(function(p){var f=rel[p.id],btn;
    if(!f)btn='<button class="btn s" style="background:var(--a)" onclick="addFriend(\''+p.id+'\',this)">Нэмэх</button>';
    else if(f.status==='accepted')btn='<small>✓ Найз</small>';
    else btn='<small>'+(f.requester===me.id?'Илгээсэн':'Хүлээж байна')+'</small>';
    return '<div class="row">'+avHTML(p)+'<div class="g">'+nameHTML(p)+'<small>@'+esc(p.username)+'</small></div>'+btn+'</div>'}).join('')||'<p style="color:var(--muted)">Олдсонгүй</p>';
}
async function addFriend(id,b){b.disabled=true;var r=await sb.from('friendships').insert({requester:me.id,addressee:id});b.outerHTML='<small>'+(r.error?'Алдаа':'Илгээсэн')+'</small>'}
async function accept(id){await sb.from('friendships').update({status:'accepted'}).eq('id',id);find()}

/* ---------- Chat ---------- */
async function openChat(id){
  cur=friends.filter(function(f){return f.id===id})[0];seen={};
  $('cinfo').innerHTML=avHTML(cur)+nameHTML(cur);$('msgs').innerHTML='';$('chat').classList.remove('hide');
  var r=await sb.from('messages').select('*').or('and(sender.eq.'+me.id+',receiver.eq.'+id+'),and(sender.eq.'+id+',receiver.eq.'+me.id+')').order('created_at').limit(200);
  (r.data||[]).forEach(addMsg);
}
function closeChat(){cur=null;$('chat').classList.add('hide')}
function addMsg(m){
  if(seen[m.id])return;seen[m.id]=1;var d=document.createElement('div');d.className='m'+(m.sender===me.id?' me':'');
  if(m.audio_url){var a=document.createElement('audio');a.controls=true;a.src=m.audio_url;d.appendChild(a)}else d.textContent=m.body;
  $('msgs').appendChild(d);$('msgs').scrollTop=$('msgs').scrollHeight;
}
async function sendRow(row){var r=await sb.from('messages').insert(Object.assign({sender:me.id,receiver:cur.id},row)).select().single();if(r.data)addMsg(r.data);else alert('Илгээж чадсангүй')}
function sendText(){var t=$('ctext').value.trim();if(!t||!cur)return;$('ctext').value='';sendRow({body:t})}
async function sendVoice(blob,type){var url=await upload('voice',blob,type);if(url)sendRow({audio_url:url})}

/* ---------- Voice + upload ---------- */
async function upload(bucket,blob,type){
  var ext=type.indexOf('mp4')>-1?'m4a':type.indexOf('webm')>-1?'webm':type.indexOf('png')>-1?'png':type.indexOf('jpeg')>-1?'jpg':'bin';
  var path=me.id+'/'+Date.now()+'.'+ext;
  var r=await sb.storage.from(bucket).upload(path,blob,{contentType:type});
  if(r.error){alert('Upload алдаа');return null}
  return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}
async function toggleRec(btn,done){
  if(rec&&rec.state==='recording'){rec.stop();return}
  try{var s=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('Микрофоны зөвшөөрөл өгнө үү');return}
  rec=new MediaRecorder(s);chunks=[];
  rec.ondataavailable=function(e){chunks.push(e.data)};
  rec.onstop=function(){s.getTracks().forEach(function(t){t.stop()});btn.classList.remove('rec');
    var type=rec.mimeType||'audio/webm';done(new Blob(chunks,{type:type}),type)};
  rec.start();btn.classList.add('rec');
  setTimeout(function(){if(rec&&rec.state==='recording')rec.stop()},60000);
}

/* ---------- Profile ---------- */
function profile(){
  var p=prof;
  $('main').innerHTML='<div style="text-align:center"><div id="pav">'+avHTML(p,true)+'</div><p><label class="btn s" style="display:inline-block;margin-top:8px;cursor:pointer">Зураг солих<input type="file" id="pf" accept="image/*" class="hide" onchange="setAvatar(this)"></label></p>'+
  '<p id="prev" style="margin-top:10px;font-size:26px">'+nameHTML(p)+'</p></div>'+
  '<h3>Username (сард 1 удаа)</h3><input id="un" value="'+esc(p.username)+'" maxlength="20" autocapitalize="none"><small style="color:var(--muted)">'+cool(p.username_changed_at,30)+'</small>'+'<h3>Нэр (7 хоногт 1 удаа)</h3><input id="dn" value="'+esc(p.display_name||p.username)+'" maxlength="30" oninput="prevName()"><small style="color:var(--muted)">'+cool(p.name_changed_at,7)+'</small>'+
  '<h3>Фонт ба градиент өнгө</h3><select id="fo" onchange="prevName()">'+FONTS.map(function(f){return '<option'+(f===p.font?' selected':'')+'>'+f+'</option>'}).join('')+'</select>'+
  '<div class="cr"><input type="color" id="c1" value="'+safeColor(p.color1)+'" oninput="prevName()"><input type="color" id="c2" value="'+safeColor(p.color2)+'" oninput="prevName()"></div>'+
  '<h3>Нот (24 цаг харагдана)</h3><input id="nt" maxlength="60" placeholder="Юу бодож байна?" value="'+esc(p.note_text||'')+'">'+
  '<div class="cr" style="align-items:center"><button class="mic" onclick="toggleRec(this,setVoiceNote)">🎤</button><span id="vn" style="color:var(--muted);font-size:14px">'+(p.note_audio?'Дуут нот бий ✓':'Дуут нот бичих')+'</span></div>'+
  '<div class="cr"><button class="btn" style="flex:1" onclick="saveProfile()">Хадгалах</button><button class="btn s" onclick="clearNote()">Нот арилгах</button></div>'+
  '<p id="ps" style="color:var(--b);min-height:22px"></p><button class="btn s" onclick="sb.auth.signOut().then(function(){location.reload()})">Гарах</button>';
}
function prevName(){$('prev').innerHTML=nameHTML({username:prof.username,display_name:$('dn').value,font:$('fo').value,color1:$('c1').value,color2:$('c2').value})}
async function patch(o){var r=await sb.from('profiles').update(o).eq('id',me.id).select().single();if(r.data)prof=r.data;return !r.error}
async function setAvatar(inp){var f=inp.files[0];if(!f)return;var url=await upload('avatars',f,f.type);if(url&&await patch({avatar_url:url}))$('pav').innerHTML=avHTML(prof,true)}
async function setVoiceNote(blob,type){var url=await upload('voice',blob,type);if(url&&await patch({note_audio:url,note_at:new Date().toISOString()}))$('vn').textContent='Дуут нот хадгалагдлаа ✓'}
function cool(ts,d){var n=ts?new Date(ts).getTime()+d*864e5:0;return n>Date.now()?'Дараа нь солих: '+new Date(n).toLocaleDateString():'Одоо солих боломжтой'}
async function patchErr(o){var r=await sb.from('profiles').update(o).eq('id',me.id).select().single();if(r.data)prof=r.data;return r.error}
async function saveProfile(){
  var msg=[];
  if(!await patch({font:$('fo').value,color1:$('c1').value,color2:$('c2').value,note_text:$('nt').value.trim()||null,note_at:new Date().toISOString()}))msg.push('Хадгалахад алдаа');
  var dn=$('dn').value.trim(),un=$('un').value.trim().toLowerCase();
  if(dn&&dn!==prof.display_name){var e=await patchErr({display_name:dn});if(e)msg.push(e.message.indexOf('name_cooldown')>-1?'Нэр: 7 хоногт 1 удаа':'Нэр солиход алдаа')}
  if(un!==prof.username){
    if(!/^[a-z0-9_]{3,20}$/.test(un))msg.push('Username: 3-20 тэмдэгт, a-z 0-9 _');
    else{var e2=await patchErr({username:un});if(e2)msg.push(e2.message.indexOf('username_cooldown')>-1?'Username: сард 1 удаа':'Username эзлэгдсэн')}
  }
  profile();$('ps').textContent=msg.length?msg.join(' · '):'Хадгалагдлаа ✓';
}
async function clearNote(){await patch({note_text:null,note_audio:null});profile()}
</script>
</body>
</html>
