<!doctype html>
<html lang="mn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Comunic</title>
<meta name="theme-color" content="#120b07">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://whdpjlujnbcjjrmoyvkb.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..800;1,700..800&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#120b07}.splash{height:100dvh;display:grid;place-items:center}</style>
<link rel="stylesheet" href="/app/app.css">
<link rel="modulepreload" href="/app/main.js">
</head>
<body>
<div id="root"><div class="splash"><div class="orbit sm"><div class="rg"></div><div class="core"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M47.3 44.9A20 20 0 1 1 47.3 19.1" fill="none" stroke="#fff3e6" stroke-width="9" stroke-linecap="round"/><path d="M13 44l-6 14 16-6z" fill="#fff3e6"/><circle cx="51" cy="32" r="5" fill="#2a1a10"/></svg></div></div></div></div>
<noscript><p style="color:#f7ebdf;font:16px sans-serif;padding:24px">Comunic ажиллахад JavaScript шаардлагатай.</p></noscript>
<script type="module" src="/app/main.js"></script>
<script>
/* Ачаалал гацвал: аль файл /app/ хавтсанд алга байгааг дэлгэцэнд харуулна */
(function(){
 var files=['main.js','config.js','store.js','icons.js','api.js','ui.js','router.js','theme.js','auth.js','chatdata.js','realtime.js','push.js','v-chats.js','v-chat.js','v-me.js','v-soon.js','app.css','sw.js'];
 function show(miss){
  var r=document.getElementById('root'); if(!r||window.__cm) return;
  var d=document.createElement('div'); d.style.cssText='min-height:100dvh;display:grid;place-items:center;padding:24px;color:#f7ebdf;font:16px/1.5 system-ui,sans-serif;text-align:center';
  var h='<div style="max-width:420px"><h2 style="margin:0 0 10px">Апп ачаалагдсангүй</h2>';
  h+=miss.length?'<p style="color:#c7ab96">Дараах файл <b>/app/</b> хавтсанд алга байна:</p><p style="font:600 15px monospace;color:#ffc08a">'+miss.join('<br>')+'</p><p style="color:#c7ab96">GitHub-ийн <b>app</b> хавтсанд эдгээрийг upload хийнэ үү.</p>':'<p style="color:#c7ab96">Файлууд бүгд байна. Интернэтээ шалгаад дахин оролдоно уу.</p>';
  h+='<button id="cm-r" style="margin-top:14px;min-height:48px;padding:0 26px;border:0;border-radius:99px;background:#db7a43;color:#2a1208;font:700 16px system-ui">Дахин ачаалах</button></div>';
  d.innerHTML=h; r.innerHTML=''; r.appendChild(d);
  document.getElementById('cm-r').onclick=function(){
   var p=[]; if(navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(x){return x.unregister()}))}));
   if(window.caches) p.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));
   Promise.all(p).then(function(){location.reload()},function(){location.reload()});
  };
 }
 setTimeout(function(){
  if(window.__cm) return;
  var miss=[],n=files.length;
  files.forEach(function(f){
   fetch('/app/'+f,{cache:'no-store'}).then(function(x){if(!x.ok)miss.push(f+' ('+x.status+')')}).catch(function(){miss.push(f+' (холбогдсонгүй)')}).then(function(){if(--n===0)show(miss)});
  });
 },7000);
})();
</script>

</body>
</html>
