<!DOCTYPE html>
<html lang="mn" data-theme="warm"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8743b"><title>Comunic</title>
<script>try{document.documentElement.dataset.theme=localStorage.theme||'warm'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Inter:wght@700&family=Orbitron:wght@700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/icon-192.png"><link rel="stylesheet" href="/style.css?v=9">
<script>window.addEventListener('error',function(e){var l=document.getElementById('lerr');if(l)l.textContent='Алдаа: '+e.message});setTimeout(function(){var l=document.getElementById('loader');if(l&&!window.__ok&&!l.classList.contains('gone')){document.getElementById('lerr').innerHTML+='<br><button onclick="location.reload()">Дахин ачаалах</button>'}},10000)</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')</script></head>
<body><div id="loader"><div class="spin"></div><b>Comu<span>nic</span></b><p id="lerr" class="fine" style="max-width:300px"></p></div>
<div id="auth">
  <h1>Comu<span>nic</span></h1>
  <p style="text-align:center;color:var(--muted)">Discord-оор нэвтэрч шууд эхэл</p>
  <button class="btn" style="background:#5865F2;padding:14px" onclick="discordLogin()">Discord-оор нэвтрэх</button>
  <div id="amsg"></div>
  <p class="fine">Нэвтэрснээр <a href="/terms.html">Үйлчилгээний нөхцөл</a> болон <a href="/privacy.html">Нууцлалын бодлого</a>-г зөвшөөрнө</p>
</div>

<div id="app" class="hide">
  <div id="main"></div>
  <div id="tabs">
    <button data-t="home" class="on">💬 Чат</button>
    <button data-t="find">🔍 Найз</button>
    <button data-t="notes">📝 Нот</button>
    <button data-t="me">👤 Профайл</button>
  </div>
  <div id="chat" class="hide">
    <div id="chead"><button class="btn s" onclick="closeChat()">←</button><div id="cinfo" style="display:flex;align-items:center;gap:10px"></div><button class="btn s" id="lock" onclick="toggleE2E()" style="margin-left:auto">🔓</button></div>
    <div id="msgs"></div>
    <div id="emo" class="hide"></div>
    <div id="cbar">
      <button class="mic" onclick="$('emo').classList.toggle('hide')">😊</button><label class="mic" style="display:flex;align-items:center;justify-content:center;cursor:pointer">📎<input type="file" multiple class="hide" onchange="sendFiles(this)"></label><button class="mic" id="cmic" onclick="toggleRec(this,sendVoice)">🎤</button>
      <input id="ctext" maxlength="6700" placeholder="Мессеж..." onkeydown="if(event.key==='Enter')sendText()">
      <button class="btn" onclick="sendText()">➤</button>
    </div>
  </div>
</div>

<script src="/app/app.js?v=9"></script></body></html>
